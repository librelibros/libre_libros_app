name: Deploy to Render

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # No secrets inherited: the same checks are safe for pull requests.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RENDER_DEPLOY == 'true'
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Validate required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIBRE_LIBROS_SECRET_KEY: ${{ secrets.LIBRE_LIBROS_SECRET_KEY }}
          LIBRE_LIBROS_DATABASE_URL: ${{ secrets.LIBRE_LIBROS_DATABASE_URL }}
          LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID }}
          LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for v in RENDER_API_KEY RENDER_SERVICE_ID SUPABASE_URL SUPABASE_KEY LIBRE_LIBROS_SECRET_KEY LIBRE_LIBROS_DATABASE_URL LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then
              echo "Secret $v is not set in repository settings. Please add it." >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Sync env vars to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIBRE_LIBROS_SECRET_KEY: ${{ secrets.LIBRE_LIBROS_SECRET_KEY }}
          LIBRE_LIBROS_DATABASE_URL: ${{ secrets.LIBRE_LIBROS_DATABASE_URL }}
          LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID }}
          LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET }}
          LIBRE_LIBROS_INIT_ADMIN_EMAIL: ${{ secrets.LIBRE_LIBROS_INIT_ADMIN_EMAIL }}
          LIBRE_LIBROS_INIT_ADMIN_PASSWORD: ${{ secrets.LIBRE_LIBROS_INIT_ADMIN_PASSWORD }}
          LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_TOKEN: ${{ secrets.LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_TOKEN }}
          LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_USERNAME: ${{ secrets.LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_USERNAME }}
          LIBRE_LIBROS_CONTACT_EMAIL: ${{ secrets.LIBRE_LIBROS_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          upsert() {
            local key="$1"
            local value="$2"
            echo "Upserting env var $key"
            curl -fsS --connect-timeout 10 --max-time 30 -X PUT \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg v "$value" '{value: $v}')" > /dev/null
          }
          upsert_optional() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              upsert "$key" "$value"
            else
              echo "Skipping $key (secret not set in GitHub)"
            fi
          }

          upsert "SUPABASE_URL"               "$SUPABASE_URL"
          upsert "SUPABASE_KEY"               "$SUPABASE_KEY"
          upsert "LIBRE_LIBROS_SECRET_KEY"    "$LIBRE_LIBROS_SECRET_KEY"
          upsert "LIBRE_LIBROS_DATABASE_URL"  "$LIBRE_LIBROS_DATABASE_URL"
          # Operating mode flags (not secret, but force-applied on every deploy
          # so a manually-created Render service can't drift away from them).
          upsert "LIBRE_LIBROS_ENVIRONMENT"          "production"
          upsert "LIBRE_LIBROS_EXTERNAL_AUTH_ONLY"   "true"
          upsert "LIBRE_LIBROS_GITHUB_OAUTH_ENABLED" "true"
          upsert "LIBRE_LIBROS_GITHUB_OAUTH_NAME"    "GitHub"
          # Bootstrap content repo (librelibros/libre_libros_content). Same
          # rationale: render.yaml `value:` only applies to Blueprint services.
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_PROVIDER"       "github"
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_NAME"           "Libre Libros Content"
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_SLUG"           "libre-libros-content"
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_NAMESPACE"      "librelibros"
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_NAME_REMOTE"    "libre_libros_content"
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_DEFAULT_BRANCH" "main"
          upsert "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_PUBLIC"         "true"
          # Public-facing contact (footer). Mirrored in render.yaml; workflow
          # is authoritative because the Render service was created manually.
          upsert "LIBRE_LIBROS_CONTACT_EMAIL"                       "libre_libros@proton.me"
          upsert_optional "LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID"        "$LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_ID"
          upsert_optional "LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET"    "$LIBRE_LIBROS_GITHUB_OAUTH_CLIENT_SECRET"
          upsert_optional "LIBRE_LIBROS_INIT_ADMIN_EMAIL"              "$LIBRE_LIBROS_INIT_ADMIN_EMAIL"
          upsert_optional "LIBRE_LIBROS_INIT_ADMIN_PASSWORD"           "$LIBRE_LIBROS_INIT_ADMIN_PASSWORD"
          upsert_optional "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_TOKEN"    "$LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_TOKEN"
          upsert_optional "LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_USERNAME" "$LIBRE_LIBROS_BOOTSTRAP_REPOSITORY_USERNAME"
          upsert_optional "LIBRE_LIBROS_CONTACT_EMAIL"                 "$LIBRE_LIBROS_CONTACT_EMAIL"

      - name: Deploy exact tested commit and wait for live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          base="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          # Never retry POST automatically: an ambiguous timeout may already have created a deploy.
          http_code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o "$response" -w '%{http_code}' -X POST "$base" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg sha "$EXPECTED_SHA" '{clearCache:"do_not_clear",commitId:$sha}')")
          case "$http_code" in
            201|202) ;;
            *) echo "::error::Render deploy request failed (HTTP $http_code)"; exit 1 ;;
          esac
          # A queued response without an ID cannot safely be followed: fail visibly.
          deploy_id=$(jq -er '.id | select(type == "string") | select(test("^dep-[A-Za-z0-9]+$"))' "$response")
          echo "Deploy $deploy_id requested for $EXPECTED_SHA"
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" "$base/$deploy_id" -o "$response"
            status=$(jq -er '.status' "$response")
            case "$status" in
              live)
                jq -e --arg sha "$EXPECTED_SHA" '.commit.id == $sha' "$response" > /dev/null
                echo "Tested commit is live"
                exit 0 ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress)
                echo "Deploy pending"
                sleep 15 ;;
              *) echo '::error::Deploy did not reach live successfully'; exit 1 ;;
            esac
          done
          echo '::error::Deadline exceeded; review Render before requesting another deploy'
          exit 1

      - name: Public liveness smoke (not DB or OAuth verification)
        run: |
          set -euo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          code=$(curl -sS --connect-timeout 10 --max-time 90 \
            -o "$response" -w '%{http_code}' https://libre-libros-app.onrender.com/healthz)
          test "$code" = 200
          jq -e '.status == "ok"' "$response" > /dev/null
