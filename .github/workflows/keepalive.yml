name: Public availability check

# Hourly independent observation; the five-minute check runs in local Hermes.
# Not an uptime guarantee: schedules may be delayed, dropped or disabled,
# and Render quotas/restarts still apply. No redeploy or restart on failure.
# Scheduled runs use the default branch; a feature-branch commit is not active.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-availability-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public liveness once
        run: |
          set -euo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          if ! code=$(curl -sS --connect-timeout 10 --max-time 90 \
            -o "$response" -w '%{http_code}' https://libre-libros-app.onrender.com/healthz); then
            echo '::error::No HTTP response within deadline (cold start, network or outage possible)'
            exit 1
          fi
          if [ "$code" != 200 ] || ! jq -e '.status == "ok"' "$response" > /dev/null 2>&1; then
            echo "::error::Public liveness failed (HTTP $code); response body withheld"
            exit 1
          fi
          echo 'Public liveness OK; database and authentication not checked'
          echo '### Public healthcheck: OK' >> "$GITHUB_STEP_SUMMARY"
          echo 'HTTP 200 and status=ok. This is not an uptime, database or login guarantee.' >> "$GITHUB_STEP_SUMMARY"
